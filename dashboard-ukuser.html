<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UK Dashboard</title>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=1">
</head>
<body class="app shell-top">
  <header>
    <h1>Hello Magda</h1>
    <div>
      <button class="top-btn" onclick="location.href='dashboard-uk-stock.html'">Live Stock Overview</button>
      <button class="top-btn" onclick="location.href='order-history.html'">Order History</button>
      <button class="top-btn logout-btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="container">
    <h2>Place an Order</h2>

    <div class="filter-row">
      <label for="searchInput">Search:</label>
      <input type="text" id="searchInput" placeholder="Search by product or SKU..." oninput="applyFilter()" />

      <label for="categoryFilter">Category:</label>
      <select id="categoryFilter" onchange="applyFilter()">
        <option value="All">All</option>
      </select>
    </div>

    <div class="table-wrap">
    <table id="stockTable">
      <thead>
        <tr>
          <th>SKU</th>
          <th>Product</th>
          <th>Category</th>
          <th>Available</th>
          <th>Qty</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    </div>

    <div class="section order-summary">
      <h3>Order Summary</h3>
      <ul id="orderPreview" class="muted"></ul>
      <button class="submit-btn" onclick="submitOrder()">Confirm and Submit Order</button>
    </div>
  </div>

  <script>
    // IMPORTANT FIX:
    // Use "sb" variable instead of "supabase" so it can NEVER clash with anything else.
    const sb = window.supabase.createClient(
      'https://rwmwsaxlqblvnhfyuuqg.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ3bXdzYXhscWJsdm5oZnl1dXFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDk4NDU3OTYsImV4cCI6MjA2NTQyMTc5Nn0.gwcRLpJzsHkSVLQs0iFULIk6eAc7FlHHF9LaERlQJ6Y'
    );

    let currentUser = null;
    let stockRows = [];
    let orderItems = [];

    async function logAction(action, details) {
      if (!currentUser) return;
      await sb.from('audit_log').insert([{
        user_id: currentUser.id,
        user_email: currentUser.email,
        action,
        details
      }]);
    }

    async function boot() {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) { window.location.href = "index.html"; return; }
      currentUser = user;

      const { data: profile, error: pErr } = await sb
        .from('profiles')
        .select('role')
        .eq('id', user.id)
        .single();

      if (pErr || !profile || profile.role !== 'uk') {
        window.location.href = "index.html";
        return;
      }

      await logAction("Login", {});
      await fetchStock();
      populateCategoryDropdown();
      renderTable();
      applyFilter();
    }

    async function fetchStock() {
      const { data, error } = await sb
        .from('stock')
        .select('id, sku, name, category, qty')
        .order('name', { ascending: true });

      if (error) {
        alert("Stock load error: " + error.message);
        console.error(error);
        stockRows = [];
        return;
      }
      stockRows = data || [];
    }

    function populateCategoryDropdown() {
      const sel = document.getElementById('categoryFilter');
      const cats = Array.from(new Set(stockRows.map(r => r.category).filter(Boolean))).sort((a,b)=>a.localeCompare(b));
      sel.innerHTML = `<option value="All">All</option>` + cats.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function renderTable() {
      const tbody = document.querySelector('#stockTable tbody');
      tbody.innerHTML = '';

      for (const item of stockRows) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.sku || ''}</td>
          <td>${item.name || ''}</td>
          <td>${item.category || ''}</td>
          <td>${item.qty ?? 0}</td>
          <td>
            <input type="number"
              min="0"
              max="${item.qty ?? 0}"
              value="0"
              data-id="${item.id}"
              data-sku="${item.sku || ''}"
              data-name="${item.name || ''}"
              data-cat="${item.category || ''}"
              data-available="${item.qty ?? 0}"
              style="width:90px;padding:6px 8px;border-radius:6px;border:none;"
            />
          </td>
          <td>
            <button class="order-btn" onclick="addToOrder(this)">Add</button>
          </td>
        `;
        tbody.appendChild(tr);
      }
    }

    function applyFilter() {
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const cat = document.getElementById('categoryFilter').value;

      document.querySelectorAll('#stockTable tbody tr').forEach(row => {
        const sku = row.cells[0].innerText.toLowerCase();
        const name = row.cells[1].innerText.toLowerCase();
        const rowCat = row.cells[2].innerText;

        const okSearch = !search || sku.includes(search) || name.includes(search);
        const okCat = (cat === 'All') || (rowCat === cat);

        row.style.display = (okSearch && okCat) ? '' : 'none';
      });
    }

    function addToOrder(btn) {
      const input = btn.closest('tr').querySelector('input');
      const qty = parseInt(input.value, 10);
      const available = parseInt(input.dataset.available, 10);

      if (!qty || qty <= 0) return;
      if (qty > available) return alert("Qty is higher than available stock.");

      orderItems.push({
        stock_id: input.dataset.id,
        sku: input.dataset.sku,
        product: input.dataset.name,
        category: input.dataset.cat,
        qty,
        available
      });

      input.value = 0;
      updateOrderPreview();
    }

    function updateOrderPreview() {
      const ul = document.getElementById('orderPreview');
      ul.innerHTML = '';
      orderItems.forEach(i => {
        ul.insertAdjacentHTML('beforeend', `<li>${i.sku ? i.sku + " — " : ""}${i.product} (${i.category}) x ${i.qty}</li>`);
      });
    }

    async function submitOrder() {
      if (!orderItems.length) return alert("No items in order.");

      const groupId = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2));

      await logAction("Place Order", { groupId, items: orderItems });

      for (const item of orderItems) {
        const { error: insErr } = await sb.from('orders').insert([{
          region: 'UK',
          sku: item.sku || null,
          product: item.product,
          category: item.category,
          qty: item.qty,
          order_group_id: groupId,
          status: 'Pending'
        }]);

        if (insErr) {
          alert("Order insert failed: " + insErr.message);
          console.error(insErr);
          return;
        }

        const { error: upErr } = await sb
          .from('stock')
          .update({ qty: item.available - item.qty })
          .eq('id', item.stock_id);

        if (upErr) {
          alert("Stock update failed: " + upErr.message);
          console.error(upErr);
          return;
        }
      }

      alert("✅ Order placed successfully!");
      orderItems = [];
      updateOrderPreview();

      await fetchStock();
      populateCategoryDropdown();
      renderTable();
      applyFilter();
    }

    async function logout() {
      await logAction("Logout", {});
      await sb.auth.signOut();
      localStorage.clear();
      sessionStorage.clear();
      setTimeout(() => window.location.href = "index.html", 200);
    }

    document.addEventListener('DOMContentLoaded', boot);
  </script>
</body>
</html>
