<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - MODNA Platform</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=1">
</head>
<body class="app shell-auth">
  <div class="login-box">
    <img src="logo1.png" alt="MODNA LASH WAREHOUSE" class="logo"/>
    <h2 id="formTitle">Sign In</h2>
    <div id="message"></div>

    <form id="loginForm" autocomplete="on">
      <input type="email" id="email" placeholder="Email" autocomplete="username" required />
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit" id="loginBtn">Sign In</button>
      <button type="button" onclick="signup()" id="signupBtn" style="display:none;">Sign Up</button>
    </form>

    <div class="switch" id="toggleForm" onclick="toggleForm()">Don't have an account? Sign up</div>
  </div>

  <script>
    // ✅ CRITICAL FIX:
    // Never declare `const supabase = ...` because it can be declared elsewhere/cached/duplicated.
    // Use one shared global client safely.
    window.__sb = window.__sb || window.supabase.createClient(
      'https://rwmwsaxlqblvnhfyuuqg.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ3bXdzYXhscWJsdm5oZnl1dXFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDk4NDU3OTYsImV4cCI6MjA2NTQyMTc5Nn0.gwcRLpJzsHkSVLQs0iFULIk6eAc7FlHHF9LaERlQJ6Y'
    );
    const sb = window.__sb;

    const monikaEmail = "plytaaa@tlen.pl"; // The specific email for Monika
    let isSignup = false;

    function toggleForm() {
      isSignup = !isSignup;
      document.getElementById('formTitle').innerText = isSignup ? "Sign Up" : "Sign In";
      document.getElementById('loginBtn').style.display = isSignup ? "none" : "";
      document.getElementById('signupBtn').style.display = isSignup ? "" : "none";
      document.getElementById('toggleForm').innerText = isSignup ? "Already have an account? Sign in" : "Don't have an account? Sign up";
      document.getElementById('message').innerText = '';
    }

    function showMsg(msg, error=false) {
      document.getElementById('message').innerHTML = `<div class="${error ? 'err' : 'msg'}">${msg}</div>`;
    }

    async function redirectByRole(user) {
      const email = (user?.email || "").toLowerCase();

      // Priority check for Monika
      if (email === monikaEmail.toLowerCase()) {
        window.location.href = "dashboard-monika.html";
        return true;
      }

      const { data: profile, error: profileError } = await sb
        .from('profiles')
        .select('status, role')
        .eq('id', user.id)
        .single();

      if (profileError) return false;

      if (profile && profile.status === "disabled") {
        showMsg('Your account is disabled. Please contact support.', true);
        await sb.auth.signOut();
        return true; // handled
      }

      if (profile?.role === "admin") { window.location.href = "dashboard-admin.html"; return true; }
      if (profile?.role === "uk")    { window.location.href = "dashboard-ukuser.html"; return true; }
      if (profile?.role === "pl")    { window.location.href = "dashboard-pluser.html"; return true; }

      <!-- ✅ ONLY CHANGE: redirect to the correct existing file -->
      if (profile?.role === "superadmin") { window.location.href = "superadmin-dashboard.html"; return true; }

      // If user exists but role missing -> go wait page (same behaviour as before)
      window.location.href = "wait-for-role.html";
      return true;
    }

    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!email || !password) return showMsg('Please enter both email and password.', true);

      const { error, data } = await sb.auth.signInWithPassword({ email, password });
      if (error) return showMsg(error.message, true);

      showMsg('Login successful! Redirecting...', false);

      // Update last_login (same as your original logic)
      if (data?.user) {
        await sb
          .from('profiles')
          .update({ last_login: new Date().toISOString() })
          .eq('id', data.user.id);
      }

      // Redirect
      const handled = await redirectByRole(data.user);
      if (!handled) {
        // Safety fallback
        window.location.href = "wait-for-role.html";
      }
    }

    async function signup() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!email || !password) return showMsg('Please enter both email and password.', true);

      const { error } = await sb.auth.signUp({ email, password });
      if (error) return showMsg(error.message, true);

      showMsg('Sign up successful! Please check your email to confirm your account.', false);
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      if (isSignup) signup();
      else login();
    });

    // ✅ Safer session handling:
    // Only redirect if session exists AND we can resolve role.
    // If session exists but profile/role is broken -> sign out so employees can log in normally.
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session?.user) return;

      const ok = await redirectByRole(session.user);
      if (!ok) {
        // Clear broken session so login works on phones/other laptops
        await sb.auth.signOut();
      }
    })();
  </script>
</body>
</html>
